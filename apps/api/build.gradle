plugins {
    id 'groovy'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.besessener'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // io.fabric8:kubernetes-client pulls in io.netty transitively; the resolved
        // version has had several fixed HIGH CVEs (netty-codec-http/-http2/
        // -compression). Force the whole io.netty:* set to the patched release.
        mavenBom 'io.netty:netty-bom:4.2.17.Final'

        // Spring Boot's own web stack uses tools.jackson:* (Jackson 3), while
        // kubernetes-client and minio still depend on com.fasterxml.jackson:*
        // (Jackson 2) transitively. Both lines have had @JsonView-bypass CVEs
        // (CVE-2026-59889, CVE-2026-54515); force both to their patched releases.
        mavenBom 'com.fasterxml.jackson:jackson-bom:2.21.5'
        mavenBom 'tools.jackson:jackson-bom:3.1.5'
    }
    dependencies {
        // spring-boot-starter-logging pulls this in via log4j-to-slf4j; bump
        // past the CVE-2026-49844 malformed-JSON fix even though it only
        // triggers under log4j-core's JsonTemplateLayout, which we don't use.
        dependency 'org.apache.logging.log4j:log4j-api:2.25.5'
    }
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.8'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.fabric8:kubernetes-client:7.8.0'
    implementation 'io.minio:minio:9.0.3'
    implementation("org.apache.groovy:groovy-json:5.0.8")
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'
    testImplementation("org.apache.groovy:groovy-json:5.0.8")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

test {
    jvmArgs("-XX:+EnableDynamicAgentLoading")
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('html')
    }
}
