name: Quality Gate

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  api:
    name: api Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Install Dependencies and Run Unit Tests
        working-directory: ./apps/api
        run: ./gradlew clean jacocoTestReport
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: always()
        with:
          check_name: "api Unit Tests"
          files: |
            ./apps/api/build/test-results/**/*.xml
      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
      - name: Convert JaCoCo to Cobertura
        run: |
          reportgenerator \
            -reports:./apps/api/build/reports/jacoco/test/jacocoTestReport.xml \
            -targetdir:coverage-report \
            -reporttypes:Cobertura
      - name: Generate Coverage Report Summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage-report/Cobertura.xml
          badge: true
          fail_below_min: true
          hide_complexity: true
          format: markdown
          output: both
          thresholds: "60 80"
      - name: Append Coverage Report to GitHub Summary
        if: always()
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
      - name: Post Coverage Comment to PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: code-coverage-results.md
          token: ${{ secrets.GITHUB_TOKEN }}

  ui:
    name: ui Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Install Dependencies
        working-directory: ./apps/ui
        run: ./npmw ci
      - name: Unit Tests and Coverage
        working-directory: ./apps/ui
        run: ./npmw run test:ci
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: always()
        with:
          check_name: "ui Unit Tests"
          files: |
            ./apps/ui/TESTS-Chrome_Headless_*.xml
      - name: Show Coverage Summary in PR
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: ./apps/ui/coverage/thrash-buddy/coverage.xml
          badge: true
          fail_below_min: true
          hide_complexity: true
          format: markdown
          output: both
          thresholds: "60 80"
      - name: Append Coverage Report to GitHub Summary
        if: always()
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
      - name: Post Coverage Comment to PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: code-coverage-results.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        working-directory: ./apps/ui
        run: ./npmw run lint

  k6:
    name: k6 Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "./apps/k6"
          severity: warning

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build api image
        run: docker build -t thrash-buddy-api:ci ./apps/api
      - name: Build ui image
        if: always()
        run: docker build -t thrash-buddy-ui:ci ./apps/ui
      - name: Build k6 image
        if: always()
        run: docker build -t thrash-buddy-k6:ci ./apps/k6

      - name: Scan api image (report, all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: thrash-buddy-api:ci
          format: sarif
          output: trivy-api.sarif
          trivyignores: apps/api/.trivyignore
      - name: Upload api SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Scan ui image (report, all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: thrash-buddy-ui:ci
          format: sarif
          output: trivy-ui.sarif
      - name: Upload ui SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-ui.sarif
          category: trivy-ui

      - name: Scan k6 image (report, all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: thrash-buddy-k6:ci
          format: sarif
          output: trivy-k6.sarif
      - name: Upload k6 SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-k6.sarif
          category: trivy-k6

      # format: sarif ignores the severity filter (it always reports all
      # severities for the Security tab), so gating on HIGH/CRITICAL needs a
      # separate table-format pass.
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities - api
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: thrash-buddy-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: apps/api/.trivyignore
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities - ui
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: thrash-buddy-ui:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities - k6
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: thrash-buddy-k6:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infra-and-images:
    concurrency:
      group: "test--infra-group-${{ github.event.pull_request.number }}"
      cancel-in-progress: false
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' # takes too long for pushes
    needs: [api, ui, k6]
    name: Infrastructure and Images
    runs-on: ubuntu-latest
    steps:
      - name: Clean up workspace
        run: rm -rf $GITHUB_WORKSPACE/*
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Write .env file
        working-directory: ./configs
        run: echo "${{ secrets.DOT_ENV }}" > .env
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ./apps/api/Dockerfile
          ignore: DL3018
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ./apps/ui/Dockerfile
          ignore: DL3018
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ./apps/k6/Dockerfile
          ignore: DL3018

      - name: Set up Kubernetes with Minikube
        run: |
          pkill -9 kubectl || true
          minikube delete --all
          minikube start --driver=docker
          eval $(minikube -p minikube docker-env --shell=bash)  # Exports the required Docker environment variables
          echo "DOCKER_TLS_VERIFY=${DOCKER_TLS_VERIFY}" >> $GITHUB_ENV
          echo "DOCKER_HOST=${DOCKER_HOST}" >> $GITHUB_ENV
          echo "DOCKER_CERT_PATH=${DOCKER_CERT_PATH}" >> $GITHUB_ENV
          echo "MINIKUBE_ACTIVE_DOCKERD=${MINIKUBE_ACTIVE_DOCKERD}" >> $GITHUB_ENV

      - name: Cleanup all Docker resources
        run: |
          docker system prune -a -f --volumes
          docker network prune -f
          docker builder prune -f
          docker image prune -a -f

      - name: Build Docker Images
        run: |
          ./buddy.sh docker build-all
          docker images

      - name: Helm
        run: |
          ./buddy.sh helm install
      - name: ui tests
        working-directory: ./tests/ui
        run: |
          # Start port-forwarding to the ingress-nginx-controller
          . ../../scripts/setup/get-config.sh
          kubectl port-forward --namespace $NAMESPACE-ingress svc/ingress-nginx-controller 8080:80 >/dev/null 2>&1 &
          PORT_FORWARD_PID=$!

          # Wait for the port-forward to be established
          sleep 5

          # Set the BASE_URL for Playwright tests
          export SUFFIX=":8080"
          export BASE_URL="http://localhost${SUFFIX}/"

          # Run tests
          ./npmw ci
          ./npmw run install
          ./npmw run test

          trap "kill $PORT_FORWARD_PID" EXIT
      - name: Publish Playwright Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: always()
        with:
          check_name: "Playwright UI Tests"
          files: ./tests/ui/test-results/results.xml
      - name: Archive Playwright Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: report.zip
          path: |
            tests/ui/test-results
            tests/ui/playwright-report
          retention-days: 7
      - name: Minikube delete cluster
        if: always()
        run: |
          pkill -9 kubectl || true
          minikube delete --all
